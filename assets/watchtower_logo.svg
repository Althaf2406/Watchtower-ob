<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgCanvas" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050811"/>
    </radialGradient>

    <!-- Thermal Flame Facet Gradient -->
    <linearGradient id="flameFacet" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="50%" stop-color="#FF5722"/>
      <stop offset="100%" stop-color="#FFC107"/>
    </linearGradient>

    <!-- Satellite Cyan / Bio-Forest Facet Gradient -->
    <linearGradient id="cyanFacet" x1="100%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="40%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Center Spire Shadow/Obsidian Core -->
    <linearGradient id="coreFacet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Rounded Base Canvas -->
  <rect width="512" height="512" rx="112" fill="#050811"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="url(#bgCanvas)" stroke="#1E293B" stroke-width="2"/>

  <!-- Minimalist Geometric "W" Watchtower Monogram -->
  <g transform="translate(0, 10)">
    <!-- Outer Wing Left (Forest / Telemetry Uplink) -->
    <polygon points="80,160 144,160 216,350 160,350" fill="#00E5FF" opacity="0.85" filter="url(#laserGlow)"/>

    <!-- Inner Left Blade (Dual Spectrum Cyan -> Emerald) -->
    <polygon points="172,160 228,160 256,310 216,350" fill="url(#cyanFacet)" filter="url(#laserGlow)"/>

    <!-- Center Watchtower Apex Spire (Ascending Focal Beam) -->
    <polygon points="256,80 238,155 274,155" fill="#FFFFFF" filter="url(#laserGlow)"/>
    <polygon points="256,165 240,250 272,250" fill="#E2E8F0" opacity="0.9"/>
    <polygon points="256,260 246,380 266,380" fill="#00E5FF" filter="url(#laserGlow)"/>

    <!-- Inner Right Blade (Thermal Infrared / SWIR Flame) -->
    <polygon points="340,160 284,160 256,310 296,350" fill="url(#flameFacet)" filter="url(#laserGlow)"/>

    <!-- Outer Wing Right (Active Flame Emitter) -->
    <polygon points="432,160 368,160 296,350 352,350" fill="#FF5722" opacity="0.85" filter="url(#laserGlow)"/>

    <!-- Focal Radar Pulse Ring (Minimalist Aperture) -->
    <circle cx="256" cy="80" r="16" fill="none" stroke="#00E5FF" stroke-width="2.5" opacity="0.6"/>
    <circle cx="256" cy="80" r="5" fill="#FFFFFF" filter="url(#laserGlow)"/>
  </g>

  <!-- Typography / Clean Wordmark -->
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#F8FAFC" letter-spacing="10">WATCHTOWER</text>
  <text x="256" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#38BDF8" letter-spacing="3">AI WILDFIRE &amp; EMISSION INTELLIGENCE</text>
</svg>
