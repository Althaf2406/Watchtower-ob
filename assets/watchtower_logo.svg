<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142850" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#070B19" stop-opacity="1"/>
    </radialGradient>
    
    <!-- Thermal Fire Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="50%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#FFD600"/>
    </linearGradient>

    <!-- Forest Emerald Gradient -->
    <linearGradient id="forestGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="40%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#69F0AE"/>
    </linearGradient>

    <!-- Radar Cyan Glow -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0091EA"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Plate (Squircle Dark Badge) -->
  <rect width="512" height="512" rx="108" fill="#070B19"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="url(#bgGlow)" stroke="#1E335E" stroke-width="2"/>

  <!-- Geospatial Radar & Orbital Grid Rings -->
  <g opacity="0.25">
    <circle cx="256" cy="256" r="210" fill="none" stroke="#00E5FF" stroke-width="1.5" stroke-dasharray="8 8"/>
    <circle cx="256" cy="256" r="160" fill="none" stroke="#00E5FF" stroke-width="1"/>
    <circle cx="256" cy="256" r="110" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="256" y1="36" x2="256" y2="476" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4 6"/>
    <line x1="36" y1="256" x2="476" y2="256" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4 6"/>
    <!-- Diagonal telemetry ticks -->
    <circle cx="256" cy="46" r="4" fill="#00E5FF"/>
    <circle cx="256" cy="466" r="4" fill="#00E5FF"/>
    <circle cx="46" cy="256" r="4" fill="#00E5FF"/>
    <circle cx="466" cy="256" r="4" fill="#00E5FF"/>
  </g>

  <!-- Uncertainty Wave Arcs (BALD Epistemic Decomposition) -->
  <g opacity="0.45" filter="url(#neonGlow)">
    <path d="M 120 220 A 150 150 0 0 1 392 220" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 150 180 A 120 120 0 0 1 362 180" fill="none" stroke="#00E676" stroke-width="2" stroke-dasharray="6 6"/>
    <path d="M 180 140 A 90 90 0 0 1 332 140" fill="none" stroke="#FF9100" stroke-width="2"/>
  </g>

  <!-- Central Emblem: The Watchtower Aperture & Dual-Spectrum Shield -->
  <!-- Left Wing: Emerald Forest / Carbon Sequestration -->
  <path d="M 256 90 
           L 150 200 
           C 150 310, 195 380, 256 425 
           L 256 90 Z" 
        fill="url(#forestGrad)" 
        opacity="0.9" />

  <!-- Right Wing: Thermal Flame & Peat Fire Inversion -->
  <path d="M 256 90 
           L 362 200 
           C 362 310, 317 380, 256 425 
           L 256 90 Z" 
        fill="url(#fireGrad)" 
        filter="url(#neonGlow)" />

  <!-- Watchtower Geometric Core / Satellite Focal Sensor -->
  <g filter="url(#neonGlow)">
    <!-- Tower Beacon / Orbital Apex -->
    <polygon points="256,120 236,170 276,170" fill="#FFFFFF"/>
    
    <!-- Central Sensor Column / Beam -->
    <path d="M 248 175 L 264 175 L 268 360 L 244 360 Z" fill="#0B132B" opacity="0.7"/>
    <line x1="256" y1="170" x2="256" y2="400" stroke="#00E5FF" stroke-width="3"/>
    
    <!-- Multi-spectral Scan Crosshair Aperture -->
    <circle cx="256" cy="270" r="38" fill="#070B19" stroke="#00E5FF" stroke-width="3.5"/>
    <circle cx="256" cy="270" r="24" fill="none" stroke="#FF5252" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="256" cy="270" r="10" fill="#FFD600"/>
    <circle cx="256" cy="270" r="4" fill="#FFFFFF"/>

    <!-- Downward Radar Radiance Fan -->
    <polygon points="256,270 200,380 312,380" fill="url(#cyanGrad)" opacity="0.2"/>
  </g>

  <!-- Topographic Elevation Contours on Forest Half -->
  <path d="M 180 260 Q 215 285 248 270" fill="none" stroke="#070B19" stroke-width="3" opacity="0.4"/>
  <path d="M 195 310 Q 225 330 248 315" fill="none" stroke="#070B19" stroke-width="3" opacity="0.4"/>

  <!-- Active Flame Chevron Accents on Thermal Half -->
  <path d="M 264 260 Q 295 240 325 270" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.75"/>
  <path d="M 264 305 Q 290 290 315 320" fill="none" stroke="#FFD600" stroke-width="3" opacity="0.6"/>

  <!-- Corner Tech Accents -->
  <g stroke="#00E5FF" stroke-width="2" opacity="0.4" fill="none">
    <path d="M 32 64 L 32 32 L 64 32"/>
    <path d="M 448 32 L 480 32 L 480 64"/>
    <path d="M 32 448 L 32 480 L 64 480"/>
    <path d="M 480 448 L 480 480 L 448 480"/>
  </g>

  <!-- Text Subtitle Mark -->
  <text x="256" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="24" fill="#E2E8F0" letter-spacing="8">WATCHTOWER</text>
  <text x="256" y="485" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="10" fill="#00E5FF" letter-spacing="4">UQ WILDFIRE &amp; CARBON AI</text>
</svg>

